name: Build MRS

on:
  push:
    paths:
      - "mihomo/domain/*.list"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y curl tar

      - name: Download mihomo (FIXED)
        run: |
          set -e

          URL=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | grep browser_download_url \
            | grep linux-amd64 \
            | head -n 1 \
            | cut -d '"' -f 4)

          echo "download: $URL"

          curl -L "$URL" -o mihomo.tar.gz

          mkdir mihomo-bin
          tar -xzf mihomo.tar.gz -C mihomo-bin

          BIN=$(find mihomo-bin -type f -name mihomo | head -n 1)
          chmod +x "$BIN"

          echo "BIN=$BIN" >> $GITHUB_ENV

      - name: Build MRS
        run: |
          set -e

          mkdir -p mihomo/mrs

          for file in mihomo/domain/*.list; do
            name=$(basename "$file" .list)

            echo "building $name"

            $BIN convert-ruleset domain text "$file" "mihomo/mrs/$name.mrs"
          done

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add mihomo/mrs/*.mrs || true

          git commit -m "build mrs" || exit 0
          git push
