name: Convert Rules to MRS

on:
  push:
    branches: [main]
    paths:
      - 'source/**.txt'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download mihomo binary
        run: |
          VERSION=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | grep '"tag_name"' | sed -E 's/.*"v([^"]+)".*/\1/')
          echo "Latest version: $VERSION"
          curl -L -o mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/v${VERSION}/mihomo-linux-amd64-compatible-v${VERSION}.gz"
          gunzip mihomo.gz
          chmod +x mihomo

      - name: Convert all txt to mrs
        run: |
          mkdir -p rules
          for file in source/*.txt; do
            name=$(basename "$file" .txt)
            echo "Converting $name..."
            ./mihomo convert-ruleset domain text "$file" "rules/${name}.mrs"
          done

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rules/*.mrs
          git diff --staged --quiet || git commit -m "Auto-update mrs rules"
          git push
